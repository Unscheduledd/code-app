name: Check GitHub Actions runners
on:
  push:
    paths:
      - .github/workflows/check-runner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner availability
        run: |
          echo "GitHub Actions Linux runner is available"
          uname -a
