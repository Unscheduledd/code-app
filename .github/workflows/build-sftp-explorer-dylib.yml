name: Build GTU SSH Explorer Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ios-sftp-explorer-dylib
    paths:
      - tweaks/GTUSSHExplorer.m
      - .github/workflows/build-sftp-explorer-dylib.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile iOS arm64 tweak
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$sdk" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc -O2 -fvisibility=hidden -dynamiclib \
            -framework Foundation -framework UIKit \
            -Wl,-install_name,@rpath/GTUSSHExplorer.dylib \
            -o build/GTUSSHExplorer.dylib tweaks/GTUSSHExplorer.m
          file build/GTUSSHExplorer.dylib
          otool -L build/GTUSSHExplorer.dylib
          shasum -a 256 build/GTUSSHExplorer.dylib
          test -s build/GTUSSHExplorer.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: GTUSSHExplorer-ios-arm64
          path: build/GTUSSHExplorer.dylib
          if-no-files-found: error
          retention-days: 30
